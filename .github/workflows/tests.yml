name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scores clínicos, signos vitales, PDF y Worker de IA
        run: npm test
      - name: Instalar navegador para pruebas de extremo a extremo
        run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo (modo demo en Chromium)
        run: npm run test:e2e
        env:
          E2E_OFFLINE: "1"

  lighthouse:
    name: Lighthouse (modo demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Medir accesibilidad, rendimiento, buenas prácticas y SEO
        run: npx -y @lhci/cli@0.15.1 autorun

name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencias sin vulnerabilidades altas o críticas
        run: npm audit --audit-level=high
      - name: Scores clínicos, signos vitales, PDF y Worker de IA
        run: npm test
      - name: Instalar navegador para pruebas de extremo a extremo
        run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo (modo demo en Chromium)
        run: npm run test:e2e
        env:
          E2E_OFFLINE: "1"

  reglas:
    name: Reglas de seguridad de Firestore (emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Probar firestore.rules con usuarios de cada rol
        run: npm run test:rules

  secretos:
    name: Secretos en el código (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: Lighthouse (modo demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Medir accesibilidad, rendimiento, buenas prácticas y SEO
        run: npx -y @lhci/cli@0.15.1 autorun

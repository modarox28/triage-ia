name: CodeQL

# Análisis estático de seguridad de GitHub: busca inyección de código (XSS), uso inseguro de datos, etc.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

jobs:
  analizar:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config: |
            paths-ignore:
              - src/vendor
              - node_modules
      - uses: github/codeql-action/analyze@v3

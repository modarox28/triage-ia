# Configuración de gitleaks (busca claves y secretos en cada cambio).
[extend]
useDefault = true

[allowlist]
description = "Valores públicos por diseño o de prueba"
regexes = [
  # La apiKey de Firebase identifica el proyecto y es pública; la seguridad está en firestore.rules
  '''AIzaSyAsNUBDVXaU-L7kuM8nDfuiFyZtjAdjSAo''',
]
paths = [
  # Las pruebas generan claves RSA de prueba al vuelo
  '''tests/.*\.test\.js''',
]
